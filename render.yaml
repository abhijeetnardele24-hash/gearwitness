services:
  - type: web
    name: gearwitness
    env: docker
    region: oregon
    plan: free
    branch: main
    dockerfilePath: Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_MODE
        value: fixture
      - key: HOST
        value: 0.0.0.0
      - key: DEBUG
        value: false
