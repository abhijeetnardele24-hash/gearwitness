name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Oxlint Frontend Lint
        working-directory: frontend
        run: npm run lint

      - name: Vitest Frontend Unit & Component Tests
        working-directory: frontend
        run: npm run test

      - name: Vite TypeScript Build
        working-directory: frontend
        run: npm run build

      - name: Archive Frontend Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  backend-and-e2e-quality-gates:
    needs: frontend-build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Frontend Dist Artifact for SPA Testing
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff Linter
        run: |
          python -m ruff check backend

      - name: Bandit Security Scan
        run: |
          python -m bandit -r backend/app

      - name: Pytest with Coverage Gate (>= 85%) & SPA Verification
        run: |
          python -m pytest backend/tests --cov=backend/app --cov-report=term-missing --cov-fail-under=85

      - name: Set up Node.js 22 for Playwright E2E
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Playwright Browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Playwright E2E & Axe Accessibility Suite
        working-directory: frontend
        run: npx playwright test

  docker-container-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image at Submitted Commit
        run: |
          docker build -t gearwitness:gate .

      - name: Start Container and Verify Health & Frontend
        run: |
          CONTAINER_ID=$(docker run -d -p 8000:8000 -e APP_MODE=fixture -e PORT=8000 gearwitness:gate)
          echo "CONTAINER_ID=$CONTAINER_ID"

          # Stop and remove container even on failure
          trap 'echo "Container Logs:"; docker logs "$CONTAINER_ID" || true; docker stop "$CONTAINER_ID" || true; docker rm "$CONTAINER_ID" || true' EXIT

          echo "Waiting for container readiness..."
          READY=0
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/v1/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "Container health check passed on attempt $i (HTTP 200)"
              READY=1
              break
            fi
            echo "Attempt $i: status code $STATUS, sleeping 1s..."
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: Container failed to become healthy within 30s"
            exit 1
          fi

          # Assert /api/v1/health returns HTTP 200 with valid status
          HEALTH_JSON=$(curl -s http://localhost:8000/api/v1/health)
          echo "Health response: $HEALTH_JSON"
          echo "$HEALTH_JSON" | grep -q '"status":"ok"'

          # Assert / returns the built frontend
          FRONTEND_HTML=$(curl -s http://localhost:8000/)
          echo "$FRONTEND_HTML" | grep -q 'id="root"'
          echo "Frontend root HTML successfully returned from Docker container"

